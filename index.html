<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Expense Tracker</h1>
      <p>Track what comes in and what goes out.</p>
    </header>

    <section class="totals" aria-label="Totals">
      <div class="total"><span>Balance</span><strong id="balance">₹0.00</strong></div>
      <div class="total"><span>Income</span><strong id="income" class="income">₹0.00</strong></div>
      <div class="total"><span>Expenses</span><strong id="expense" class="expense">₹0.00</strong></div>
    </section>

    <div class="layout">
      <section class="card">
        <h2 id="form-title">Add transaction</h2>
        <form id="transaction-form">
          <label>Title <input name="title" maxlength="100" required></label>
          <div class="row">
            <label>Amount <input name="amount" type="number" min="0.01" step="0.01" required></label>
            <label>Type
              <select name="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>Category <input name="category" list="categories" maxlength="50" required></label>
            <label>Date <input name="date" type="date" required></label>
          </div>
          <datalist id="categories">
            <option value="Food"><option value="Rent"><option value="Travel">
            <option value="Shopping"><option value="Bills"><option value="Salary">
          </datalist>
          <label>Note <textarea name="note" rows="2" maxlength="300"></textarea></label>
          <p id="form-error" class="error" role="alert" hidden></p>
          <div class="actions">
            <button type="submit" id="save-button">Add transaction</button>
            <button type="button" id="cancel-button" class="secondary" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="list-header">
          <h2>Transactions</h2>
          <form id="filters" class="filters">
            <select name="type" aria-label="Filter by type">
              <option value="">All types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
            <input name="from" type="date" aria-label="From date">
            <input name="to" type="date" aria-label="To date">
          </form>
        </div>
        <p id="list-message" class="muted" role="status"></p>
        <ul id="transactions" class="transactions"></ul>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
